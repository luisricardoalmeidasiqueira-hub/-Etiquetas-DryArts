<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etiquetas Dry'Arts</title>
<link rel="apple-touch-icon" href="dryarts-app-icon.png">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f6f4ea;
color:#173d2d;
font-family:Arial,sans-serif
}

header{
background:#164d38;
color:#fff;
text-align:center;
padding:24px
}

.logo{
font:46px cursive
}

.sub{
letter-spacing:3px;
font-size:12px;
margin-top:6px
}

main{
max-width:900px;
margin:auto;
padding:20px 15px
}

h2{
font-size:21px
}

.modelos{
display:flex;
gap:10px;
overflow:auto;
padding-bottom:10px
}

.modelo,.add{
min-width:145px;
background:#fff;
border:2px solid #d5e3d5;
border-radius:15px;
padding:10px;
text-align:center
}

.modelo.sel{
border-color:#299452
}

.modelo img{
width:125px;
height:100px;
object-fit:contain
}

.excluir{
background:#c62828;
font-size:13px;
padding:8px;
margin-top:8px;
border-radius:8px
}

.add{
height:140px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold
}

.card{
background:#fff;
border-radius:18px;
padding:15px;
margin-top:15px;
box-shadow:0 2px 10px #0001
}

.preview{
width:100%;
max-height:360px;
object-fit:contain;
background:#f5f0e4;
border-radius:12px
}

.controles{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px
}

.campo{
background:#fff;
border:1px solid #d5e3d5;
border-radius:12px;
padding:10px
}

.campo label{
display:block;
font-weight:bold;
font-size:13px;
margin-bottom:6px
}

select{
width:100%;
padding:11px;
border:1px solid #ccdccc;
border-radius:9px;
font-size:16px
}

.info{
background:#edf6ed;
padding:11px;
border-radius:10px;
margin-top:12px;
font-size:13px
}

button{
width:100%;
padding:15px;
border:0;
border-radius:13px;
background:#164d38;
color:white;
font-size:17px;
font-weight:bold;
margin-top:14px
}

footer{
text-align:center;
padding:25px;
color:#476957;
font:18px cursive
}

#file{
display:none
}

.print{
display:none
}

@media(max-width:600px){
.controles{
grid-template-columns:1fr
}
}

@media print{

@page{
size:A4;
margin:8mm
}

body{
background:#fff
}

.noPrint{
display:none!important
}

.print{
display:grid!important;
grid-template-columns:repeat(var(--cols),1fr);
gap:5mm
}

.item{
width:var(--tam);
height:var(--tam);
display:flex;
align-items:center;
justify-content:center
}

.item img{
width:100%;
height:100%;
object-fit:contain
}

}
</style>
</head>

<body>

<header>
<div class="logo">Dry'Arts</div>
<div class="sub">ETIQUETAS PERSONALIZADAS</div>
<div>ARTE EM CADA DETALHE</div>
</header>

<main class="noPrint">

<h2>🖼️ Escolha o modelo</h2>

<div class="modelos" id="modelos"></div>

<div class="card">
<h2>🏷️ Pré-visualização</h2>
<img id="preview" class="preview">
</div>

<div class="controles">

<div class="campo">
<label>Tamanho</label>
<select id="tam"></select>
</div>

<div class="campo">
<label>Quantidade</label>
<select id="q">
<option value="auto">Folha A4 automática</option>
<option>1</option>
<option>4</option>
<option>6</option>
<option>8</option>
<option>10</option>
</select>
</div>

<div class="campo">
<label>Orientação</label>
<select id="orientacao">
<option>Retrato</option>
<option>Paisagem</option>
</select>
</div>

</div>

<div class="info" id="info"></div>

<button onclick="imprimir()">🖨️ Imprimir Etiquetas</button>

<button onclick="file.click()">🖼️ Adicionar imagem</button>

<input id="file" type="file" accept="image/*" multiple>

</main>

<div class="print" id="folha"></div>

<footer class="noPrint">
♡ Obrigado por fazer parte dessa história!
<br>
<b>Dry'Arts</b>
<br>
Feito com carinho, criado por Luís Ricardo.
</footer>

<script>

const pad=`data:image/svg+xml,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350">
<rect width="100%" height="100%" rx="35" fill="#f8f1df"/>
<text x="50%" y="45%" text-anchor="middle" font-size="70" fill="#164d38">🌿</text>
<text x="50%" y="72%" text-anchor="middle" font-size="38" font-family="cursive" fill="#164d38">Dry'Arts</text>
</svg>
`)}`;

let modelosSalvos=
JSON.parse(localStorage.getItem('dryarts-modelos')||'[]');

let modelos=[
{
id:'pad',
nome:'Lírio (Padrão)',
src:pad
},
...modelosSalvos
];

let atual='pad';

for(let i=6;i<=20;i++){
tam.innerHTML+=`<option>${i}</option>`;
}

function salvarModelos(){

localStorage.setItem(
'dryarts-modelos',
JSON.stringify(modelos.filter(x=>x.id!=='pad'))
);

}

function render(){

modelosDiv();

let escolhido=modelos.find(x=>x.id==atual);

if(escolhido){
preview.src=escolhido.src;
}

let cm=+tam.value;

let cols=Math.max(1,Math.floor(19.4/cm));
let rows=Math.max(1,Math.floor(28.1/cm));

info.textContent=
`📄 A4 automático: aproximadamente ${cols*rows} etiqueta(s) de ${cm} cm por folha.`;

}

function modelosDiv(){

modelosEl=document.getElementById('modelos');

modelosEl.innerHTML='';

modelos.forEach(m=>{

let d=document.createElement('div');

d.className=
'modelo'+(m.id==atual?' sel':'');

let excluir='';

if(m.id!=='pad'){

excluir=`
<button class="excluir"
onclick="excluirModelo(event,'${m.id}')">
🗑️ Excluir
</button>
`;

}

d.innerHTML=`
<img src="${m.src}">
<div>${m.nome}</div>
${excluir}
`;

d.onclick=()=>{

atual=m.id;

render();

};

modelosEl.append(d);

});

let a=document.createElement('div');

a.className='add';

a.innerHTML='＋<br>Adicionar imagem';

a.onclick=()=>file.click();

modelosEl.append(a);

}

function excluirModelo(event,id){

event.stopPropagation();

let modelo=modelos.find(x=>x.id==id);

if(!modelo)return;

if(confirm(`Excluir a imagem "${modelo.nome}"?`)){

modelos=modelos.filter(x=>x.id!=id);

salvarModelos();

if(atual==id){

atual='pad';

}

render();

}

}

file.onchange=()=>{

[...file.files].forEach(f=>{

let r=new FileReader();

r.onload=()=>{

let m={
id:Date.now()+Math.random(),
nome:f.name,
src:r.result
};

modelos.push(m);

salvarModelos();

atual=m.id;

render();

};

r.readAsDataURL(f);

});

file.value='';

};

tam.onchange=render;

q.onchange=render;

function imprimir(){

let m=modelos.find(x=>x.id==atual);

if(!m)return;

let cm=+tam.value;

let r=

q.value=='auto'
?
Math.max(
1,
Math.floor(19.4/cm)*
Math.floor(28.1/cm)
)
:
+q.value;

folha.innerHTML='';

folha.style.setProperty(
'--cols',
Math.max(1,Math.floor(19.4/cm))
);

folha.style.setProperty(
'--tam',
cm+'cm'
);

for(let i=0;i<r;i++){

folha.innerHTML+=`
<div class="item">
<img src="${m.src}">
</div>
`;

}

window.print();

}

render();

</script>

</body>
</html>
